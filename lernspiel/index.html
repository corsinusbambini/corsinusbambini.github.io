<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernspiel ist umgezogen</title>
  <meta http-equiv="refresh" content="2; url=https://lernspiel.pages.dev/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3e9d2; color: #222831;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    div { background: #fbf6ea; padding: 24px; border: 3px solid #222831; border-radius: 4px; box-shadow: 6px 6px 0 #222831;
          width: min(340px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; }
    h1 { font: 700 1.4rem Georgia, serif; margin: 0 0 8px; }
    a { color: #2a7d72; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <h1>Lernspiel ist umgezogen</h1>
    <p>Die App ist jetzt hier:<br><a href="https://lernspiel.pages.dev/">lernspiel.pages.dev</a></p>
  </div>
  <script>
    // Alten Service Worker samt gespeicherter Kopie entfernen, dann weiterleiten.
    (async () => {
      try {
        // Nur die Lern-App, nicht die anderen Projektseiten auf github.io.
        for (const reg of await navigator.serviceWorker.getRegistrations()) {
          if (new URL(reg.scope).pathname.startsWith('/lernspiel/')) await reg.unregister();
        }
        for (const key of await caches.keys()) if (key.startsWith('lernspiel-')) await caches.delete(key);
      } catch (e) {}
      location.replace('https://lernspiel.pages.dev/');
    })();
  </script>
</body>
</html>
